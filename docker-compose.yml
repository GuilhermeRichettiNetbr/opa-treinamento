services:
  opa:
    build: ./opa
    ports:
      - "8181:8181"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}

  servico-produtos:
    build: ./servico-produtos
    ports:
      - "8080:8080"
    environment:
      OPA_URL: http://opa:8181
    depends_on:
      - opa
